# Render Blueprint: one Docker web service + one managed PostgreSQL database.
# Dashboard > New > Blueprint > pick this repository. Then open the service's
# Environment tab and paste TV_MASTER_KEY and TV_AUDIT_KEY from
#   python -m trustvault generate-keys
# (they are marked sync:false so they never live in the repository).
databases:
  - name: trustvault-db
    plan: free
    databaseName: trustvault
    user: trustvault

services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TV_ENV
        value: production
      - key: TV_DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: TV_MASTER_KEY
        sync: false
      - key: TV_AUDIT_KEY
        sync: false
      - key: TV_TRUSTED_PROXIES
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: TV_SEED_DEMO
        value: "true"
      - key: TV_DEMO_MODE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
